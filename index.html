<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>船舶实时追踪系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<style>
:root{--bg:#eef1f5;--bg1:#fff;--bg2:#f3f5f8;--tx1:#1a1d23;--tx2:#4a5568;--tx3:#8899aa;--bd:#dde4ed;--ac:#2563eb;--gr:#059669;--ye:#d97706;--rd:#dc2626;--ra:10px;--ra2:6px;--sh:0 1px 3px rgba(0,0,0,.05);--sh2:0 4px 12px rgba(0,0,0,.07)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--tx1);height:100vh;overflow:hidden;font-size:15px}
#app{display:flex;flex-direction:column;height:100vh}
.wm{text-align:center;padding:3px;font-size:10px;color:var(--tx3);background:var(--bg1);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;height:46px;padding:0 14px;background:var(--bg1);border-bottom:1px solid var(--bd);gap:10px;box-shadow:var(--sh)}
.bar .logo{font-size:15px;font-weight:700;color:var(--ac)}
.bar .dot{width:9px;height:9px;border-radius:50%;background:var(--rd);flex-shrink:0}
.bar .dot.ok{background:var(--gr)}
.bar .st{font-size:12px;color:var(--tx2)}
.bar .st b{color:var(--ac)}
.bar button{padding:6px 14px;border:1px solid var(--bd);background:var(--bg1);color:var(--tx2);border-radius:var(--ra2);cursor:pointer;font-size:12px;font-weight:500;transition:.2s;font-family:inherit;white-space:nowrap}
.bar button:hover{background:var(--bg2);border-color:var(--ac);color:var(--ac)}
.bar button:active{transform:scale(.96)}
.bar button.bf{background:var(--ac);color:#fff;border:none;font-weight:600}
.main{display:flex;flex:1;overflow:hidden}
#map{flex:1;z-index:1}
#map .ol{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--bg1);border:1px solid var(--bd);border-radius:14px;padding:4px 14px;font-size:12px;color:var(--tx2);pointer-events:none;box-shadow:var(--sh2)}
#map .ol b{color:var(--ac)}
#map .lg{position:absolute;bottom:10px;left:10px;z-index:1000;display:flex;gap:8px;background:var(--bg1);border:1px solid var(--bd);border-radius:12px;padding:3px 10px;font-size:10px;color:var(--tx2);box-shadow:var(--sh)}
.lc{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:2px}
.lc.a{background:var(--ac)}.lc.b{background:var(--ye)}.lc.c{background:var(--gr)}.lc.d{background:#7c3aed}
.pn{width:380px;background:var(--bg1);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh)}
.pn h2{padding:12px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.pn h2 .bdg{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--bg2);color:var(--tx2)}
.list{flex:1;overflow-y:auto;padding:6px 8px}
.list::-webkit-scrollbar{width:3px}
.list::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.card{background:var(--bg1);border:1px solid var(--bd);border-radius:var(--ra);padding:11px;margin-bottom:6px;cursor:pointer;transition:.2s;box-shadow:var(--sh);animation:su .3s ease-out}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.card:hover{transform:translateY(-1px);box-shadow:var(--sh2);border-color:var(--ac)}
.card:active{transform:scale(.98)}
.card.on{border-color:var(--ac);background:#f0f4ff}
.card .l1{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.card .nm{font-size:14px;font-weight:600}
.card .nm .en{font-size:11px;color:var(--tx3);font-weight:400;margin-left:4px}
.card .st{font-size:10px;padding:1px 7px;border-radius:6px;font-weight:500}
.card .st.go{background:#e8f0fe;color:var(--ac)}.card .st.s1{background:#fef3e2;color:var(--ye)}.card .st.bt{background:#e6f7ee;color:var(--gr)}
.card .l2{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;font-size:11px;color:var(--tx3)}
.card .l2 s{color:var(--tx1);text-decoration:none;font-weight:500}
.to{display:inline-block;background:#fef2f2;color:var(--rd);font-size:9px;padding:1px 5px;border-radius:3px}
.modal{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center}
.modal.s{display:flex;animation:fi .2s}
.modal .bg{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px)}
.modal .bx{position:relative;background:var(--bg1);border:1px solid var(--bd);border-radius:var(--ra);max-width:700px;width:95%;max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.12);animation:mi .3s ease-out}
@keyframes mi{from{opacity:0;transform:scale(.95) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal .x{position:sticky;top:8px;float:right;width:30px;height:30px;border:none;background:var(--bg2);color:var(--tx2);border-radius:50%;cursor:pointer;font-size:16px;z-index:1;margin-right:12px;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal .x:hover{background:#fee2e2;color:var(--rd)}
.modal .bdy{padding:20px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.di{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--ra2);padding:9px}
.di .lb{font-size:10px;color:var(--tx3);margin-bottom:2px}
.di .vl{font-size:15px;font-weight:600}
.di .vl.hi{color:var(--ac);font-size:17px}
.stl{font-size:13px;font-weight:600;color:var(--tx2);margin:14px 0 7px;padding-bottom:3px;border-bottom:2px solid var(--bd)}
#tkm{height:220px;border-radius:var(--ra);border:1px solid var(--bd);margin-top:8px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns button{padding:7px 14px;border:1px solid var(--bd);background:var(--bg1);color:var(--tx2);border-radius:var(--ra2);cursor:pointer;font-size:12px;transition:.2s;font-family:inherit}
.btns button:hover{background:var(--bg2);border-color:var(--ac);color:var(--ac)}
.btns button.pri{background:var(--ac);color:#fff;border:none}
.leaflet-container{background:#e8ecf1!important;font-family:inherit!important}
.leaflet-control-zoom a{background:var(--bg1)!important;color:var(--tx1)!important;border:1px solid var(--bd)!important;border-radius:var(--ra2)!important}
.leaflet-popup-content-wrapper{background:var(--bg1)!important;color:var(--tx1)!important;border:1px solid var(--bd)!important;border-radius:var(--ra)!important;box-shadow:var(--sh2)!important;font-family:inherit!important;font-size:13px!important}
.leaflet-popup-tip{background:var(--bg1)!important}
.leaflet-bar{border:1px solid var(--bd)!important;border-radius:var(--ra2)!important;box-shadow:var(--sh)!important}
</style>
</head>
<body>
<div id="app">
<div class="wm">© 开发人: 李明谦 &nbsp;|&nbsp; 仅供测试使用 &nbsp;|&nbsp; 未经允许不得用于商业应用</div>
<header class="bar">
<div class="logo">⚓ 船舶实时追踪</div>
<div class="dot" id="sd"></div>
<span class="st">📍 <b id="cl">31.97, 120.43</b> | 船舶: <b id="cnt">--</b> | <span id="tl">就绪</span></span>
<input id="skw" placeholder="🔍 搜索船名/MMSI..." style="width:180px;padding:5px 10px;border:1px solid var(--bd);border-radius:var(--ra2);font-size:12px;outline:none;font-family:inherit" onkeydown="if(event.key==='Enter')search()">
<button onclick="search()">搜索</button>
<button onclick="load()" class="bf">🔄 手动刷新</button>
</header>
<div class="main">
<div id="map"><div class="ol" id="ol">点击「手动刷新」加载船舶数据</div><div class="lg"><span class="lc a"></span>货船 <span class="lc b"></span>油轮 <span class="lc c"></span>渔船 <span class="lc d"></span>客船</div></div>
<div class="pn"><h2>🚢 船舶列表 <span class="bdg" id="pb">--</span></h2><div class="list" id="sl"></div></div>
</div>
</div>
<div class="modal" id="md"><div class="bg"></div><div class="bx"><button class="x" onclick="cls()">&times;</button><div class="bdy" id="mb"></div></div></div>
<script>
// Key已通过浏览器设置到localStorage
let KEY=localStorage.getItem('shipxy_api_key')||localStorage.getItem('sk');
if(!KEY){document.body.innerHTML='<div style="text-align:center;padding:60px;font-family:Microsoft YaHei,sans-serif"><h2>⚠ 需要API Key</h2><p style="color:#4a5568;margin-top:12px">请在浏览器控制台执行：</p><code style="background:#f3f5f8;padding:8px 16px;border-radius:6px;display:inline-block;margin-top:8px">localStorage.setItem("shipxy_api_key","你的Key")</code><p style="margin-top:12px"><button onclick="location.reload()" style="padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px">刷新页面</button></p></div>';throw new Error('No Key');}
const HOME={lat:31.97,lng:120.43};
let map,hm,allShips=[],sel=null,apiCalls=0;
const TP={0:'未知',30:'渔船',50:'引航船',60:'客船',70:'货船',71:'集装箱船',80:'油轮',81:'化学品船',82:'液化气船',90:'散货船',100:'杂货船'};
const NS={'0':'航行中','1':'锚泊','5':'靠泊','255':'未知'};
const SC={'0':'go','1':'s1','5':'bt'};
const KWS=['zhangjiagang','taicang','nanton','jiangyin','nanjing','suzhou','shanghai','ningbo','yangtze'];

function init(){
  map=L.map('map',{center:[HOME.lat,HOME.lng],zoom:10,zoomControl:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20}).addTo(map);
  L.control.scale({imperial:false,metric:true}).addTo(map);
  const hi=L.divIcon({html:'<div style="width:20px;height:20px;background:#dc2626;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(220,38,38,.35)"></div>',iconSize:[20,20],iconAnchor:[10,10]});
  hm=L.marker([HOME.lat,HOME.lng],{icon:hi}).addTo(map).bindPopup('<b>📍 张家港保税区</b>');
  map.on('mousemove',e=>document.getElementById('cl').textContent=e.latlng.lat.toFixed(4)+', '+e.latlng.lng.toFixed(4));
  load();
}

async function load(){
  document.getElementById('tl').textContent='查询中...';document.getElementById('sd').className='dot';apiCalls=0;
  const discovered=[];
  for(const kw of KWS){if(apiCalls>=9)break;apiCalls++;try{const r=await fetch(`https://api.shipxy.com/apicall/v3/SearchShip?key=${KEY}&keywords=${kw}&max=10`);const d=await r.json();if(d.status===0&&d.data)for(const s of d.data){if(!discovered.find(x=>x.mmsi===s.mmsi))discovered.push(s);}}catch(e){}}
  if(discovered.length===0){document.getElementById('sl').innerHTML='<div style="text-align:center;padding:50px;color:var(--tx3)">📭 搜索无结果</div>';document.getElementById('tl').textContent='无数据';return;}
  allShips=discovered.map(s=>({...s,_ok:false}));
  for(const s of discovered.slice(0,20)){if(apiCalls>=40)break;apiCalls++;try{const r=await fetch(`https://api.shipxy.com/apicall/v3/GetSingleShip?key=${KEY}&mmsi=${s.mmsi}`);const d=await r.json();if(d.status===0&&d.data){const idx=allShips.findIndex(x=>String(x.mmsi)===String(s.mmsi));if(idx>=0)allShips[idx]={...allShips[idx],...d.data,_ok:true};}}catch(e){}}
  render();
  document.getElementById('tl').textContent=new Date().toLocaleTimeString('zh-CN')+' ('+apiCalls+'次)';
  document.getElementById('sd').className=allShips.some(s=>s._ok)?'dot ok':'dot';
  document.getElementById('cnt').textContent=allShips.length;
  document.getElementById('ol').innerHTML='船舶: <b>'+allShips.filter(s=>s._ok).length+'</b>/'+allShips.length+' 艘有位置 | 点击船舶看详情';
}

function render(){
  document.querySelectorAll('.sm').forEach(el=>map.removeLayer(el));
  const cs={70:'#2563eb',71:'#2563eb',80:'#d97706',81:'#d97706',82:'#d97706',30:'#059669',60:'#7c3aed',90:'#64748b',100:'#2563eb',default:'#2563eb'};
  allShips.filter(s=>s._ok&&s.lat&&s.lng).forEach(s=>{const c=cs[s.ship_type]||cs.default;const nm=s.ship_cnname||s.ship_name||String(s.mmsi);const ic=L.divIcon({html:`<div style="position:relative"><div style="width:14px;height:14px;background:${c};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.2)"></div><div style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#fff;color:${c};font-size:10px;font-weight:600;white-space:nowrap;padding:1px 5px;border-radius:3px;max-width:100px;overflow:hidden;text-overflow:ellipsis">${nm.slice(0,8)}</div></div>`,className:'sm',iconSize:[14,14],iconAnchor:[7,7]});const m=L.marker([s.lat,s.lng],{icon:ic}).addTo(map);m.on('click',()=>detail(s.mmsi));});
  const ok=allShips.filter(s=>s._ok).length;
  document.getElementById('pb').textContent=ok+'/'+allShips.length;
  document.getElementById('sl').innerHTML=allShips.map((s,i)=>{const cn=s.ship_cnname||'',en=s.ship_name||'未知',dn=cn||en;const sk=s._ok,st=SC[s.navistat]||'go',nv=sk?NS[s.navistat]||'--':'--';return`<div class="card${sel===String(s.mmsi)?' on':''}" onclick="detail(${s.mmsi})" style="animation-delay:${i*.03}s"><div class="l1"><div class="nm">${dn}${!sk?'<span class="to">无位置</span>':''}${cn&&en!==cn?`<span class="en">${en}</span>`:''}</div><div class="st ${st}">${nv}</div></div><div class="l2"><div>MMSI:<s>${s.mmsi}</s></div><div>类型:<s>${TP[s.ship_type]||s.ship_type}</s></div><div>航速:<s>${sk?(s.sog===-1?'--':s.sog?.toFixed(1)+'节'):'--'}</s></div><div>航向:<s>${sk?(s.cog===-1?'--':s.cog?.toFixed(0)+'°'):'--'}</s></div>${sk&&s.dest?`<div style="grid-column:1/-1">🎯:<s style="color:#059669">${s.dest}</s></div>`:''}${sk&&s.eta?`<div style="grid-column:1/-1">ETA:<s style="color:#d97706">${s.eta}</s></div>`:''}</div></div>`;}).join('');
}

async function detail(mmsi){
  sel=String(mmsi);render();const s=allShips.find(x=>String(x.mmsi)===sel);if(!s)return;
  if(s.lat&&s.lng)map.flyTo([s.lat,s.lng],11,{duration:.7});
  let ar=null,arOk=false,rg=null,rgOk=false,tk=null,tkOk=false;
  try{const r=await fetch(`https://api.shipxy.com/apicall/v3/GetShipArchives?key=${KEY}&mmsi=${mmsi}`);const d=await r.json();if(d.status===0&&d.data)ar=d.data[0]||null;arOk=true;}catch(e){}
  try{const r=await fetch(`https://api.shipxy.com/apicall/v3/GetShipRegistry?key=${KEY}&mmsi=${mmsi}`);const d=await r.json();if(d.status===0&&d.data)rg=d.data;rgOk=true;}catch(e){}
  try{const r=await fetch(`https://api.shipxy.com/apicall/v3/GetShipTrack?key=${KEY}&mmsi=${mmsi}`);const d=await r.json();if(d.status===0&&d.data)tk=d.data;tkOk=true;}catch(e){}
  const sk=s._ok,cn=s.ship_cnname||'',en=s.ship_name||'未知',dn=cn||en,tcn=TP[s.ship_type]||s.ship_type;
  let ah='';if(!arOk)ah='<div style="padding:12px;background:#fef2f2;border-radius:8px;color:var(--rd);text-align:center;margin-top:10px">📋 档案查询失败</div>';
  else if(ar)ah=`<div class="stl">📋 船舶档案与运营信息</div><div class="dg"><div class="di"><div class="lb">运营方(货物承运人)</div><div class="vl" style="font-size:13px">${ar.operator_company||'--'}</div></div><div class="di"><div class="lb">注册所有方(船东)</div><div class="vl" style="font-size:13px">${ar.registered_owner||'--'}</div></div><div class="di"><div class="lb">船舶类型</div><div class="vl">${ar.ship_type||tcn}</div></div><div class="di"><div class="lb">总吨/载重吨</div><div class="vl">${ar.gross_tonnage?.toLocaleString()||'--'}/${ar.deadweight?.toLocaleString()||'--'}</div></div><div class="di"><div class="lb">TEU(集装箱)</div><div class="vl hi">${ar.teu?.toLocaleString()||'--'}</div></div></div>`;
  let th='';if(!tkOk)th='<div style="padding:12px;background:#fef2f2;border-radius:8px;color:var(--rd);text-align:center;margin-top:10px">🛣️ 轨迹查询失败</div>';
  else if(tk&&tk.length>0)th=`<div class="stl">🛣️ 历史航线轨迹 (${tk.length}点)</div><div id="tkm"></div>`;
  document.getElementById('mb').innerHTML=`<h2>🚢 ${dn}${cn&&en!==cn?` <small style="color:var(--tx3);font-size:13px;font-weight:400">${en}</small>`:''}</h2><div class="sub">MMSI:${s.mmsi} | IMO:${s.imo||'--'} | 呼号:${s.call_sign||'--'} | ${tcn}${rgOk&&rg?` | 船籍:${rg.registry}`:''}</div><div class="stl">📍 实时动态</div><div class="dg"><div class="di"><div class="lb">纬度</div><div class="vl hi">${sk?s.lat?.toFixed(4):'--'}</div></div><div class="di"><div class="lb">经度</div><div class="vl hi">${sk?s.lng?.toFixed(4):'--'}</div></div><div class="di"><div class="lb">航速SOG</div><div class="vl">${sk?(s.sog===-1?'无效':s.sog?.toFixed(1)+'节'):'--'}</div></div><div class="di"><div class="lb">航迹向COG</div><div class="vl">${sk?(s.cog===-1?'无效':s.cog?.toFixed(0)+'°'):'--'}</div></div><div class="di"><div class="lb">航行状态</div><div class="vl">${sk?NS[s.navistat]||'--':'--'}</div></div><div class="di"><div class="lb">🎯目的地</div><div class="vl" style="color:var(--gr)">${sk?(s.dest||'--'):'--'}</div></div><div class="di"><div class="lb">ETA预计到港</div><div class="vl" style="color:var(--ye)">${sk&&s.eta?s.eta:'--'}</div></div><div class="di"><div class="lb">船长/船宽</div><div class="vl">${sk?(s.length||'--')+'/'+(s.width||'--')+'m':'--'}</div></div><div class="di"><div class="lb">吃水</div><div class="vl">${sk&&s.draught!=null?s.draught.toFixed(1)+'m':'--'}</div></div><div class="di"><div class="lb">数据源</div><div class="vl">${s.data_source===0?'AIS岸基':'AIS卫星'}</div></div><div class="di"><div class="lb">最后更新</div><div class="vl" style="font-size:11px">${s.last_time||'--'}</div></div></div>${ah}${th}<div class="btns"><button class="pri" onclick="cls()">关闭</button>${sk&&s.lat?`<button onclick="map.flyTo([${s.lat},${s.lng}],14);cls()">📍 地图定位</button>`:''}</div>`;
  document.getElementById('md').classList.add('s');
  if(tk&&tk.length>0)setTimeout(()=>{const e=document.getElementById('tkm');if(!e)return;const tm=L.map(e,{zoomControl:true,attributionControl:false});L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(tm);const ll=tk.map(p=>[p.lat,p.lng]);L.polyline(ll,{color:'#2563eb',weight:3,opacity:.8}).addTo(tm);if(ll.length){L.circleMarker(ll[0],{radius:6,color:'#059669',fillOpacity:.8}).addTo(tm);L.circleMarker(ll[ll.length-1],{radius:6,color:'#dc2626',fillOpacity:.8}).addTo(tm);tm.fitBounds(L.latLngBounds(ll),{padding:[15,15]});}},300);
}

async function search(){
  const kw=document.getElementById('skw').value.trim();if(!kw)return;
  document.getElementById('tl').textContent='搜索中...';
  try{const r=await fetch(`https://api.shipxy.com/apicall/v3/SearchShip?key=${KEY}&keywords=${encodeURIComponent(kw)}&max=10`);const d=await r.json();
  if(d.status===0&&d.data?.length){const ms=d.data.map(s=>s.mmsi).join(',');const r2=await fetch(`https://api.shipxy.com/apicall/v3/GetManyShip?key=${KEY}&mmsis=${ms}`);const d2=await r2.json();
  if(d2.status===0&&d2.data){d2.data.forEach(ns=>{const idx=allShips.findIndex(x=>String(x.mmsi)===String(ns.mmsi));if(idx>=0)allShips[idx]={...allShips[idx],...ns,_ok:true};else allShips.push({...ns,_ok:true});});render();if(d2.data.length===1)detail(d2.data[0].mmsi);}}else{document.getElementById('tl').textContent='未找到';}}catch(e){}
  document.getElementById('tl').textContent=new Date().toLocaleTimeString('zh-CN');
}

function cls(){document.getElementById('md').classList.remove('s');}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
